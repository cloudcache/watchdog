syntax = "proto3";

package watchdog.flow.v1;

option go_package = "github.com/cloudcache/watchdog/internal/flowcollect/flowpb;flowpb";

message NormalizedRecordBatch {
  uint32 batch_schema_version = 1;
  bytes normalized_batch_id = 2;
  bytes datagram_id = 3;
  uint32 virtual_shard = 4;
  uint32 partition_map_version = 5;
  uint32 physical_partition = 6;
  uint32 replay_generation = 7;
  string tenant_id = 8;
  string collector_id = 9;
  string exporter_id = 10;
  uint64 registry_version = 11;
  int64 received_at_unix_ms = 12;
  uint32 protocol = 13;
  bytes source_ip = 14;
  uint64 observation_domain_id = 15;
  repeated NormalizedRecord records = 16;
  reserved 17 to 31;

  // sFlow datagram state. Per-sample state remains on each record.
  uint32 sub_agent_id = 32;
  uint32 datagram_sequence = 33;
  bytes agent_ip = 34;
  uint64 exporter_epoch = 35;
}

message NormalizedRecord {
  uint32 record_index = 1;
  int64 event_time_unix_ms = 2;
  string target_id = 3;
  string device_id = 4;
  uint32 observation_if_index = 5;
  uint32 observation_direction = 6;
  uint32 in_if = 7;
  uint32 out_if = 8;
  bytes src_ip = 9;
  bytes dst_ip = 10;
  uint32 src_port = 11;
  uint32 dst_port = 12;
  uint32 ip_proto = 13;
  uint32 tcp_flags = 14;
  uint64 raw_bytes = 15;
  uint64 raw_packets = 16;
  uint32 sampling_mode = 17;
  uint64 sampling_rate = 18;
  uint64 estimated_bytes = 19;
  uint64 estimated_packets = 20;
  uint64 flow_duration_ms = 21;
  uint64 quality_flags = 22;
  reserved 23 to 31;

  uint32 src_as = 32;
  uint32 dst_as = 33;
  uint32 source_id_type = 34;
  uint32 source_id_value = 35;
  uint32 sample_sequence = 36;
  uint64 sample_pool = 37;
  uint64 exporter_drops = 38;
  uint32 sample_index = 39;
  uint64 quality_epoch = 40;
}

// CollectState is the durable decoder state for one transport source,
// protocol and observation domain. The compacted Kafka key is state_key.
message CollectState {
  uint32 state_schema_version = 1;
  bytes state_id = 2;
  bytes state_key = 3;
  bytes datagram_id = 4;
  string tenant_id = 5;
  string collector_id = 6;
  string exporter_id = 7;
  uint64 registry_version = 8;
  int64 received_at_unix_ms = 9;
  uint32 protocol = 10;
  bytes source_ip = 11;
  uint64 observation_domain_id = 12;
  bytes templates_json = 13;
  bytes sampling_rates_json = 14;
  bytes payload_sha256 = 15;
  // state_identity_key is stable across collector ownership changes. state_key
  // additionally contains ownership_epoch so a fenced old owner cannot
  // overwrite the current owner's compacted checkpoint.
  bytes state_identity_key = 16;
  uint64 ownership_epoch = 17;
  uint64 state_generation = 18;
}

// DecodeFailure is a terminal, Kafka-acknowledged outcome for a durable WAL
// datagram. payload is empty unless explicitly enabled for restricted diagnosis.
message DecodeFailure {
  uint32 failure_schema_version = 1;
  bytes event_id = 2;
  bytes datagram_id = 3;
  string tenant_id = 4;
  string collector_id = 5;
  string exporter_id = 6;
  uint64 registry_version = 7;
  int64 received_at_unix_ms = 8;
  uint32 protocol = 9;
  bytes source_ip = 10;
  uint64 observation_domain_id = 11;
  string error_code = 12;
  string error_summary = 13;
  uint32 attempts = 14;
  bytes payload_sha256 = 15;
  bytes payload = 16;
  bool payload_truncated = 17;
}

// QuarantineEvent is rate-limited metadata for an unregistered source. It
// never carries the datagram payload and has no tenant supplied by the packet.
message QuarantineEvent {
  uint32 event_schema_version = 1;
  bytes event_id = 2;
  string collector_id = 3;
  int64 received_at_unix_ms = 4;
  uint32 protocol = 5;
  bytes source_ip = 6;
  uint64 observation_domain_id = 7;
  string reason_code = 8;
  uint32 payload_bytes = 9;
  bytes payload_sha256 = 10;
}

// Quality state is local durability metadata. It is protobuf-framed in an
// append journal and periodically compacted into QualityStateSnapshot.
message QualityExporterKey {
  uint32 protocol = 1;
  bytes source_ip = 2;
  uint64 sequence_scope = 3;
  bytes agent_ip = 4;
  uint32 sub_agent_id = 5;
}

message QualityWindows {
  int64 template_until_unix_ms = 1;
  int64 gap_until_unix_ms = 2;
  int64 pool_reset_until_unix_ms = 3;
  int64 rate_change_until_unix_ms = 4;
  int64 restart_until_unix_ms = 5;
  int64 out_of_order_until_unix_ms = 6;
}

message QualityExporterState {
  QualityExporterKey key = 1;
  bool initialized = 2;
  uint32 expected_sequence = 3;
  uint32 uptime = 4;
  bool uptime_valid = 5;
  int64 last_seen_unix_ms = 6;
  uint64 epoch = 7;
  uint64 sampling_epoch = 8;
  uint64 sampling_rate = 9;
  bool sampling_rate_known = 10;
  QualityWindows windows = 11;
}

message QualitySourceState {
  QualityExporterKey exporter = 1;
  uint32 source_id_type = 2;
  uint32 source_id_value = 3;
  bool initialized = 4;
  uint32 expected_sequence = 5;
  uint32 sample_pool = 6;
  uint32 drops = 7;
  uint64 sampling_rate = 8;
  bool rate_known = 9;
  int64 last_seen_unix_ms = 10;
  uint64 exporter_epoch = 11;
  uint64 epoch = 12;
  QualityWindows windows = 13;
}

message QualityDecision {
  bytes datagram_id = 1;
  uint64 exporter_epoch = 2;
  repeated uint64 record_flags = 3;
  repeated uint64 record_epochs = 4;
}

message QualityJournalRecord {
  uint32 state_schema_version = 1;
  bytes datagram_id = 2;
  uint64 wal_segment = 3;
  int64 wal_offset = 4;
  QualityExporterState exporter_state = 5;
  repeated QualitySourceState source_states = 6;
  QualityDecision decision = 7;
  bytes payload_sha256 = 8;
  string collector_id = 9;
  // Schema v2 metadata required to promote a terminally committed journal
  // post-state into an owner-fenced QualityCheckpoint.
  string tenant_id = 10;
  string exporter_id = 11;
  uint64 registry_version = 12;
  uint64 ownership_epoch = 13;
  uint64 observation_domain_id = 14;
}

message QualityStateSnapshot {
  uint32 state_schema_version = 1;
  string collector_id = 2;
  int64 created_at_unix_ms = 3;
  repeated QualityExporterState exporters = 4;
  repeated QualitySourceState sources = 5;
  repeated QualityDecision pending_decisions = 6;
  bytes payload_sha256 = 7;
  // Schema v2 local publication state. Checkpoints contain only journal
  // post-states whose terminal WAL acknowledgements crossed WAL.Sync.
  repeated QualityCheckpoint committed_checkpoints = 8;
  repeated bytes dirty_state_identity_keys = 9;
}

// QualityCheckpoint contains only terminally committed post-state for one
// exporter quality identity. It is safe for a new collector owner to restore
// from a typed keyspace in the compacted collect-state topic; state_key is the
// 32-byte owner-fenced portion of that Kafka key.
message QualityCheckpoint {
  uint32 checkpoint_schema_version = 1;
  bytes state_key = 2;
  bytes state_identity_key = 3;
  string tenant_id = 4;
  string collector_id = 5;
  string exporter_id = 6;
  uint64 registry_version = 7;
  uint64 ownership_epoch = 8;
  uint64 state_generation = 9;
  int64 committed_at_unix_ms = 10;
  uint64 observation_domain_id = 11;
  QualityExporterState exporter_state = 12;
  repeated QualitySourceState source_states = 13;
  bytes payload_sha256 = 14;
  // Highest durable terminal-ACK journal position folded into this state.
  // Compared only within the same collector_id + ownership_epoch.
  uint64 last_wal_segment = 15;
  int64 last_wal_offset = 16;
  bytes last_datagram_id = 17;
}
