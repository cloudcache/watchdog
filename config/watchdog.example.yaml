mysql:
  dsn: "user:password@tcp(127.0.0.1:3306)/watchdog?parseTime=true&multiStatements=true"
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: 30m

victoriametrics:
  base_url: "http://127.0.0.1:8428"

# Provider endpoints and credentials stay in their existing sections. This
# section only enables the unified query gateway and bounds query concurrency;
# enabling ClickHouse requires the Flow task to register its provider.
query_gateway:
  enabled: true
  victoriametrics_enabled: true
  victoriametrics_max_concurrent: 8
  clickhouse_enabled: false
  clickhouse_max_concurrent: 16

# Optional machine-only Prometheus endpoint at /metrics on the hub's existing
# listener. The bearer value is read once from the file at startup. ACL checks
# the direct TCP peer and deliberately ignores forwarding headers.
metrics_scrape:
  enabled: false
  token_file: "/run/secrets/watchdog-metrics-token"
  allowed_cidrs:
    - "127.0.0.0/8"
    - "::1/128"

export:
  dir: "exports"
  worker_interval: 30s
  worker_batch: 10
  worker_concurrency: 2
  metric: "watchdog_snmp_if_in_bps"

address_library:
  dir: "address-artifacts"
  max_upload_bytes: 2147483648
  import_batch_size: 1000
  worker_concurrency: 1
  object_retention: 720h
  object_gc_interval: 5m
  object_gc_batch: 100
  # Approval private keys stay outside Watchdog. This process loads only the
  # tenant-scoped Ed25519 public keys at startup (SubjectPublicKeyInfo PEM).
  trusted_keys: []
  # - tenant_id: "tenant_example"
  #   key_id: "address-publisher-2026"
  #   public_key_file: "/etc/watchdog/address-publisher-2026.pub.pem"

snmp_collector:
  tenant_id: "tenant_dev"
  interval: 1m
  poll_limit: 500
  discovery_interval: 30s
  discovery_batch: 10

# Formal flow data plane. tenant/exporter bindings are supplied only by the
# signed plan; no tenant is trusted from YAML or a datagram.
collector_principal_provider:
  enabled: false
  name: "enterprise-kafka"
  base_url: "https://kafka-credential-provider.watchdog.internal"
  policy_revision: "watchdog-flow-runtime-v1"
  request_timeout: 10s
  failure_threshold: 5
  circuit_open_interval: 30s
  min_operation_retention: 720h
  tls_ca_file: "/etc/watchdog/provider/ca.crt"
  tls_cert_file: "/etc/watchdog/provider/control-plane.crt"
  tls_key_file: "/etc/watchdog/provider/control-plane.key"
  tls_server_name: "kafka-credential-provider.watchdog.internal"

# Optional control-plane Ed25519 signer for collector plans. The public key and
# monotonic trust bundle are persisted in MySQL; the private key remains only in
# this owner-readable file. Set both fields or leave both empty.
collector_plan_signing:
  key_id: ""
  private_key_file: ""
# key_id: "collector-plan-2026-01"
# private_key_file: "/run/secrets/watchdog-collector-plan-ed25519"

aggregate_graph:
  rollup_interval: 5m

# MIB resolution. The collector ships an embedded core MIB bundle
# (IF-MIB, ENTITY-MIB, BGP4-MIB, HOST-RESOURCES-MIB, ...) so it works with no
# config. mib_dirs layers extra MIB trees on top (e.g. a LibreNMS checkout's
# mibs directory; subdirectories like mibs/cisco must be listed explicitly).
# mib_load names extra modules to parse from those dirs, comma-separated, or
# "ALL" to parse every file directly inside each dir (slow on large trees).
snmp:
  mib_dirs:
    - "/opt/librenms/mibs"
  mib_load: ""

snmp_trap_agent:
  api_url: "http://127.0.0.1:8090"
  token: "change-me"
  listen: ":162"

# Local watchdog-system-agent bootstrap. Command flags override these values.
agent:
  hub_url: "http://127.0.0.1:8090"
  agent_id: "agent_dev_snmp"
  token: "change-me"
  interval: 1m

# Offline flow-geo-v2 bundle (EdgeManager merged+corrected geo library) used
# by Flow query labels and the IP-library lookup API. Historical bundles keep
# old facts explainable and must precede the active bundle's effective time.
# Export with scripts/edgemanager-geo-export.py; empty path disables the service.
flow_geo:
  path: ""
  historical_paths: []

# Compatibility rollup and shared ClickHouse connection. The 1m/1h realtime
# scheduler is legacy; leave enabled=false for Storage V2. Connection fields
# remain here during the compatibility window and are also used by Flow query
# and flow_storage. Secrets are file-backed only.
flow_rollup:
  enabled: false
  scan_interval: 30s
  late_arrival_window: 5m
  bootstrap_lookback: 24h
  max_tenants_per_scan: 500
  max_buckets_per_series_scan: 500
  max_buckets_per_scan: 5000
  worker_concurrency: 2
  lease_for: 2m
  max_attempts: 5
  retry_base: 30s
  clickhouse_address: "127.0.0.1:9000"
  clickhouse_database: "watchdog_flow"
  clickhouse_user: "default"
  clickhouse_password_file: ""
  clickhouse_max_conns: 2
  clickhouse_min_conns: 0
  clickhouse_dial_timeout: 3s
  # ch-go uses this as a packet polling interval, not a whole-query deadline.
  clickhouse_read_timeout: 90s
  clickhouse_operation_timeout: 5m
  clickhouse_tls: false
  clickhouse_tls_ca: ""
  clickhouse_tls_cert: ""
  clickhouse_tls_key: ""
  clickhouse_tls_server_name: ""

# Storage V2 sealed UTC-day downsample. Retention/lateness values are published
# per tenant through /api/v1/flow/storage/policies; static config only bounds
# the scheduler and operation-job workers. Raw deletion remains fail-closed.
flow_storage:
  enabled: false
  scan_interval: 5m
  max_policies_per_scan: 500
  max_partitions_per_scan: 100
  worker_concurrency: 2
  lease_for: 30m
  max_attempts: 5
  retry_base: 1m
