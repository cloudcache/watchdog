mysql:
  dsn: "root:@tcp(127.0.0.1:3306)/watchdog_dev?parseTime=true&multiStatements=true"
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: 30m

victoriametrics:
  base_url: "http://127.0.0.1:8428"

query_gateway:
  enabled: true
  victoriametrics_enabled: true
  victoriametrics_max_concurrent: 8
  # Opt in with WATCHDOG_QUERY_CLICKHOUSE_ENABLED=true and a ClickHouse
  # password secret file; never make the shared dev config depend on a local secret.
  clickhouse_enabled: false
  clickhouse_max_concurrent: 8

export:
  dir: "exports"
  worker_interval: 30s
  worker_batch: 10
  metric: "watchdog_snmp_if_in_bps"

address_library:
  dir: "address-artifacts"
  max_upload_bytes: 2147483648
  import_batch_size: 1000
  worker_concurrency: 1
  object_retention: 720h
  object_gc_interval: 5m
  object_gc_batch: 100

snmp_collector:
  tenant_id: "tenant_dev"
  interval: 1m
  poll_limit: 500
  discovery_interval: 30s
  discovery_batch: 10

collector_principal_provider:
  enabled: false
  name: ""
  base_url: ""
  policy_revision: ""
  request_timeout: 10s
  failure_threshold: 5
  circuit_open_interval: 30s
  min_operation_retention: 720h
  tls_ca_file: ""
  tls_cert_file: ""
  tls_key_file: ""
  tls_server_name: ""

collector_plan_signing:
  key_id: ""
  private_key_file: ""

aggregate_graph:
  rollup_interval: 5m

snmp:
  mib_dirs:
    - "/Users/chenliliang/Downloads/librenms-master/mibs"
    - "/Users/chenliliang/Downloads/librenms-master/mibs/huawei"
  # Embedded MIBs cover core polling. Interface-address and vendor BGPv2
  # providers resolve lazily from this full MIB tree; "ALL" would eagerly
  # parse every file at startup and is unnecessary.
  mib_load: ""

snmp_trap_agent:
  api_url: "http://127.0.0.1:8090"
  token: "dev-agent-token"
  listen: ":1162"

agent:
  hub_url: "http://127.0.0.1:8090"
  agent_id: "agent_dev_snmp"
  token: "dev-agent-token"
  interval: 1m

flow_rollup:
  # Legacy realtime rollup; Storage V2 uses flow_storage below.
  enabled: false
  scan_interval: 30s
  late_arrival_window: 5m
  bootstrap_lookback: 24h
  max_tenants_per_scan: 500
  max_buckets_per_series_scan: 500
  max_buckets_per_scan: 5000
  worker_concurrency: 2
  lease_for: 2m
  max_attempts: 5
  retry_base: 30s
  clickhouse_address: "127.0.0.1:9000"
  clickhouse_database: "watchdog_flow"
  clickhouse_user: "default"
  clickhouse_password_file: ""
  clickhouse_max_conns: 2
  clickhouse_min_conns: 0
  clickhouse_dial_timeout: 3s
  clickhouse_read_timeout: 90s
  clickhouse_operation_timeout: 5m
  clickhouse_tls: false
  clickhouse_tls_ca: ""
  clickhouse_tls_cert: ""
  clickhouse_tls_key: ""
  clickhouse_tls_server_name: ""

flow_storage:
  # Enable only after ClickHouse migration 011 and a tenant policy are published.
  enabled: false
  scan_interval: 5m
  max_policies_per_scan: 500
  max_partitions_per_scan: 100
  worker_concurrency: 2
  lease_for: 30m
  max_attempts: 5
  retry_base: 1m

flow_reconciliation:
  # Enable only with the exact source-stream incarnation used by the worker.
  # First activation also requires one explicit partition: offset cutover per
  # already-committed Kafka partition; later scans resume MySQL watermarks.
  enabled: false
  source_stream_id: ""
  kafka_brokers: ["127.0.0.1:9092"]
  kafka_topic: "watchdog.flow.raw-v1"
  kafka_consumer_group: "watchdog-flow-worker-v1"
  kafka_client_id: "watchdog-flow-reconciliation"
  schedule_cron: "*/5 * * * *"
  bootstrap_offsets: {}
  max_batches: 5000
  max_fact_rows: 500000
  max_read_bytes: 536870912
  lease_for: 5m
  max_attempts: 5
  retry_base: 30s
  kafka_tls: false
  kafka_tls_ca: ""
  kafka_tls_cert: ""
  kafka_tls_key: ""
  kafka_tls_server_name: ""
  kafka_sasl_mechanism: "none"
  kafka_sasl_username: ""
  kafka_sasl_password_file: ""
