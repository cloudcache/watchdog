mysql:
  dsn: "root:@tcp(127.0.0.1:3306)/watchdog_dev?parseTime=true&multiStatements=true"
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: 30m

victoriametrics:
  base_url: "http://127.0.0.1:8428"

export:
  dir: "exports"
  worker_interval: 30s
  worker_batch: 10
  metric: "watchdog_snmp_if_in_bps"

snmp_collector:
  tenant_id: "tenant_dev"
  interval: 1m
  poll_limit: 500
  discovery_interval: 30s
  discovery_batch: 10

sflow_collector:
  listen: ":6343"
  tenant_id: "tenant_dev"
  agg_interval: 1m
  prefix_sync_interval: 5m

flow_collect:
  control_plane_url: "http://127.0.0.1:8090"
  state_dir: "/tmp/watchdog-flow-collect"
  plan_file: "/tmp/watchdog-flow-collect/plan.json"
  plan_public_key_file: "/tmp/watchdog-flow-collect/plan-ed25519.pub"
  sflow_listen: ":16343"
  netflow_listen: ":12055"
  socket_count: 1
  decode_workers: 2
  decode_queue_datagrams: 4096
  receive_buffer_bytes: 4194304
  max_datagram_bytes: 65535
  plan_refresh_interval: 30s
  decoder_state_ttl: 30m
  exporter_refresh_interval: 30s
  wal:
    max_bytes: 1073741824
    max_age: 24h
    segment_bytes: 16777216
    fsync_interval: 10ms
    soft_watermark: 0.70
    hard_watermark: 0.90
  kafka:
    brokers: ["127.0.0.1:9092"]
    normalized_topic: "watchdog.flow.normalized.v1"
    collect_state_topic: "watchdog.flow.collect-state.v1"
    decode_dlq_topic: "watchdog.flow.decode-dlq.v1"
    quarantine_topic: "watchdog.flow.quarantine.v1"
    acks: "all"
    compression: "zstd"
    tls: false
  normalized_batch:
    max_records: 1024
    max_bytes: 1048576
    max_wait: 5ms
  diagnostics:
    decode_max_attempts: 3
    retry_initial: 250ms
    retry_max: 5s
    quarantine_queue_events: 1024
    quarantine_max_events_per_second: 20
    quarantine_max_events_per_source_second: 2
    dlq_payload_max_bytes: 0
  quality:
    state_ttl: 1h
    anomaly_window: 1m
    journal_fsync_interval: 10ms
    checkpoint_interval: 5m
    journal_max_bytes: 67108864
    max_exporters: 1024
    max_data_sources: 8192
  observability:
    listen: "127.0.0.1:19464"
    read_header_timeout: 2s
    write_timeout: 10s
    idle_timeout: 30s
    shutdown_timeout: 5s

aggregate_graph:
  rollup_interval: 5m

snmp:
  mib_dirs:
    - "/Users/chenliliang/Downloads/librenms-master/mibs"
    - "/Users/chenliliang/Downloads/librenms-master/mibs/huawei"
  # Embedded MIBs cover core polling. Interface-address and vendor BGPv2
  # providers resolve lazily from this full MIB tree; "ALL" would eagerly
  # parse every file at startup and is unnecessary.
  mib_load: ""

snmp_trap_agent:
  api_url: "http://127.0.0.1:8091"
  token: "dev-agent-token"
  listen: ":1162"

agent:
  hub_url: "http://127.0.0.1:8091"
  agent_id: "agent_dev_snmp"
  token: "dev-agent-token"
  interval: 1m
