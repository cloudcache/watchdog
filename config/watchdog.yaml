# Watchdog v2 (KISS) configuration — the single YAML shared by server, collectors,
# workers, and optional standalone agents.
# Frontend and backend are separate builds: the server never serves static files.
# Only two persistent authorities: MySQL (management) and ClickHouse (time-series + log/alert).
# Kafka is RawFlow transport only. Secrets may be overridden by env (WATCHDOG_MYSQL_DSN,
# WATCHDOG_CLICKHOUSE_PASSWORD_FILE, WATCHDOG_ADMIN_PASSWORD) instead of being committed here.

server:
  listen: "127.0.0.1:8091"          # the single API_URL the frontend points at
  origins:                          # CORS allowlist for the separate frontend build
    - "http://127.0.0.1:8090"

mysql:                              # the only mutable-management authority
  dsn: "root:@tcp(127.0.0.1:3306)/watchdog?parseTime=true&loc=UTC&charset=utf8mb4"

clickhouse:                         # flow facts + SNMP/system time-series + log/alert
  address: "127.0.0.1:9000"
  database: "watchdog_flow"
  username: "default"
  password_file: "data/secrets/clickhouse-password" # generated by `make local-secrets`; never committed

kafka:                              # RawFlow transport (buffering/replay only)
  brokers:
    - "127.0.0.1:9092"
  topic: "watchdog.flow.raw"
  consumer_group: "watchdog-flow-worker"
  sasl_mechanism: ""               # none/plain/scram-sha-256/scram-sha-512
  sasl_username: ""
  sasl_password_file: ""

flow:                               # runtime inputs; lifecycle policy is published from MySQL
  geo:                              # geo catalog/lookup bundle for flow reports + overseas
    path: "data/flow-geo"           # dev fixture; production feeds this from a published geo dimension artifact
  reconciliation:                   # Kafka->ClickHouse count/counter audit; no per-record hash
    enabled: false                  # source_stream_id/bootstrap are deployment-specific; never guess offset zero
    source_stream_id: ""
    interval: "5m"
    bootstrap_offsets: {}
    max_batches: 1000
    max_fact_rows: 250000
    max_read_bytes: 536870912

agent_plans:                        # one installation-wide immutable plan signer
  signing_key_id: "watchdog-agent-plan-v1"
  signing_private_key: "data/agent-plan-ed25519.pem" # generated mode 0600 on first server start
  default_ttl: "8760h"              # one year; agents may use a verified LKG while offline

snmp:                               # generic standard MIB discovery works with empty values
  definitions_dir: "/Users/chenliliang/Downloads/librenms-master" # versioned LibreNMS OS/vendor definitions
  definitions_version: "librenms-local-2026-09-12"
  mib_dirs:                          # external capability MIBs layered over the embedded core bundle
    - "/Users/chenliliang/Downloads/librenms-master/mibs"
  mib_load: ""                       # optional module list or ALL
  poll_interval: 1m                  # scheduler wakeup; each recipe still owns its interval
  poll_limit: 500                    # maximum due devices per scheduler pass
  poll_concurrency: 32               # bounded concurrent devices
  export_dir: "data/snmp-exports"    # async SNMP CSV artifacts; operation_jobs owns lifecycle state
  export_retention: "24h"            # expired artifacts are no longer downloadable
  query_max_intermediate_rows: 250000 # correction/aggregation input ceiling; max_data_points remains the final chart budget
  query_max_execution_time: "15s"     # per ClickHouse read; billing v2 will use smaller checkpointed slices
  query_max_rows_to_read: 50000000
  query_max_bytes_to_read: 4294967296  # 4 GiB
  query_max_memory_bytes: 2147483648   # 2 GiB

billing:
  export_dir: "data/billing-exports" # CSV/Parquet evidence artifacts; state stays in operation_jobs
  export_retention: "168h"           # seven days; closed period evidence can be regenerated deterministically
  max_account_ports: 1000            # operational budget, not a billing formula
  max_page_size: 500                  # maximum rows returned by one billing VTable request
  max_period_duration: "9600h"       # 400 days; supports annual backfill without unbounded queries
  max_export_rows: 100000            # bounded evidence materialization per export
  max_publication_refs: 10000        # provenance cardinality budget
  max_publication_bytes: 8388608     # provenance JSON byte budget
  worker_poll_interval: "2s"
  worker_lease: "30s"                # heartbeat renews this lease while a job is running
  worker_max_attempts: 5
  worker_retry_base: "30s"

address:                            # geo/address-library source imports (MMDB/IPDB)
  artifact_dir: "data/address-artifacts"  # where uploaded source databases are stored
  max_upload_bytes: 2147483648      # per-upload ceiling (2 GiB); the upload route enforces this, not the 8 MiB JSON cap

admin:                              # first-run bootstrap only; ignored once an admin exists
  username: "admin"
  password: ""                      # empty -> interactive /install; never generated or logged

# Optional standalone agents read only their own section. Their credentials are
# enrolled by the server and must be supplied through the documented environment
# variables or an owner-readable deployment override; they are never committed.
snmp_trap_agent:
  api_url: "http://127.0.0.1:8091"
  token: ""                         # WATCHDOG_SNMP_TRAP_TOKEN
  listen: ":1162"

agent:
  hub_url: "http://127.0.0.1:8091"
  agent_id: ""
  token: ""                         # WATCHDOG_AGENT_TOKEN
  interval: "1m"
