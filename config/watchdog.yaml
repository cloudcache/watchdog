# Watchdog v2 (KISS) configuration — single YAML shared by the server and flow workers.
# Frontend and backend are separate builds: the server never serves static files.
# Only two persistent authorities: MySQL (management) and ClickHouse (time-series + log/alert).
# Kafka is RawFlow transport only. Secrets may be overridden by env (WATCHDOG_MYSQL_DSN,
# WATCHDOG_CLICKHOUSE_PASSWORD_FILE, WATCHDOG_ADMIN_PASSWORD) instead of being committed here.

server:
  listen: "127.0.0.1:8091"          # the single API_URL the frontend points at
  origins:                          # CORS allowlist for the separate frontend build
    - "http://127.0.0.1:8090"

mysql:                              # the only mutable-management authority
  dsn: "root:@tcp(127.0.0.1:3306)/watchdog?parseTime=true&loc=UTC&charset=utf8mb4"

clickhouse:                         # flow facts + SNMP/system time-series + log/alert
  address: "127.0.0.1:9000"
  database: "watchdog_flow"
  username: "default"
  password_file: ""                 # path to a file holding the CH password; empty for none

kafka:                              # RawFlow transport (buffering/replay only)
  brokers:
    - "127.0.0.1:9092"
  topic: "watchdog.flow.raw"
  consumer_group: "watchdog-flow-worker"
  sasl_username: ""
  sasl_password_file: ""

flow:                               # explicit global retention/downsample policy
  retention_raw_days: 365           # keep raw flow at full precision (~1 year)
  downsample_after_days: 365        # downsample only after this age (no hardcoded 30 days)
  rollup_1m_days: 180
  rollup_1h_days: 400

agent_plans:                        # one installation-wide immutable plan signer
  signing_key_id: "watchdog-agent-plan-v1"
  signing_private_key: "data/agent-plan-ed25519.pem" # generated mode 0600 on first server start
  default_ttl: "8760h"              # one year; agents may use a verified LKG while offline

snmp:                               # generic standard MIB discovery works with empty values
  definitions_dir: ""               # optional LibreNMS checkout for OS/vendor definitions
  definitions_version: ""
  mib_dirs: []                       # optional additional vendor MIB directories
  mib_load: ""                       # optional module list or ALL
  poll_interval: 1m                  # scheduler wakeup; each recipe still owns its interval
  poll_limit: 500                    # maximum due devices per scheduler pass
  poll_concurrency: 32               # bounded concurrent devices
  export_dir: "data/snmp-exports"    # async SNMP CSV artifacts; operation_jobs owns lifecycle state
  export_retention: "24h"            # expired artifacts are no longer downloadable

billing:
  export_dir: "data/billing-exports" # CSV/Parquet evidence artifacts; state stays in operation_jobs
  export_retention: "168h"           # seven days; closed period evidence can be regenerated deterministically

admin:                              # first-run bootstrap only; ignored once an admin exists
  username: "admin"
  password: ""                      # empty -> interactive /install; never generated or logged
