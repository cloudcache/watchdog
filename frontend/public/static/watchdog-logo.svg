<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="10.9 10.8 72.9 31.2" role="img" aria-label="WD">
  <title>WD</title>
  <!-- Faithful vector replica of the referenced 2004 blue-badge WD monogram
       (traced from the public SVG, original coordinates preserved; shifted to
       origin only). Two requested edits:
       1) the W's LEFT two top segments are joined into the body (wlstack-
          style solid W) by extending their bottom edges along their own
          slopes - restore coordinates are noted inline;
       2) the W's top segment nearest the D is recolored #fc0082.
       Background transparent (badge kept in a comment); glyphs #2d74ff.
       viewBox is tightened to the glyph bounds - to restore the badge,
       also set viewBox back to "0 0 91.19 53.35". -->
  <g transform="translate(-557.49697 -495.59365)">
    <!-- background removed (transparent); restore by uncommenting:
         <path id="badge" fill="#00529f" d="M 648.67876,543.2571 C 648.67876,546.40552 646.13567,548.94173 643.00038,548.94173 L 563.17099,548.94173 C 560.03787,548.94173 557.49697,546.40552 557.49697,543.2571 L 557.49697,501.27829 C 557.49697,498.15172 560.03787,495.59365 563.17099,495.59365 L 643.00038,495.59365 C 646.13567,495.59365 648.67876,498.15172 648.67876,501.27829 L 648.67876,543.2571" /> -->
