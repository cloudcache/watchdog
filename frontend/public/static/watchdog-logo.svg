         body strokes' slopes), so the union is seamless with no kink. To
         restore the detached original, put the bottom vertices back to
         (572.31859,513.98126)/(580.27923,514.00313) and
         (584.65642,514.00313)/(594.75564,514.00313). -->
    <path id="w-dot-left1" fill="#2d74ff" d="M 579.68810,518.00000 L 581.19119,507.83748 L 573.00102,507.83748 L 571.87225,518.00000 L 579.68810,518.00000" />
