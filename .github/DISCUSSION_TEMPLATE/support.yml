body:
  - type: checkboxes
    id: terms
    attributes:
      label: Welcome!
      description: |
        Thank you for reaching out to the Watchdog community for support! To help us assist you better, please make sure to review the following points before submitting your request:

        Please note:
        **- Please do not submit support reqeusts that are specific to ZFS. We plan to add integration with ZFS utilities in the near future.**

      options:
      - label: I have read the [Documentation](https://github.com/cloudcache/watchdog/tree/main/docs)
        required: true
      - label: I have checked existing [issues](https://github.com/cloudcache/watchdog/issues) and my problem was not mentioned there.
        required: true
      - label: I have searched open and closed issues and discussions and my problem was not mentioned before.
        required: true
      - label: I have verified I am using the latest version available. You can check the latest release [here](https://github.com/cloudcache/watchdog/releases).
        required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of Watchdog is this about?
      options:
        - Hub
        - Agent
        - Hub & Agent
    default: 0
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Problem Description
      description: |
        How to write a good bug report?

        - Respect the issue template as much as possible.
        - The title should be short and descriptive.
        - Explain the conditions which led you to report this issue: the context.
        - The context should lead to something, a problem that you’re facing.
        - Remain clear and concise.
        - Format your messages to help the reader focus on what matters and understand the structure of your message, use [Markdown syntax](https://help.github.com/articles/github-flavored-markdown)
    validations:
      required: true

  - type: input
    id: system
    attributes:
      label: OS / Architecture
      placeholder: linux/amd64 (agent), freebsd/arm64 (hub)
    validations:
      required: true
  
#  - type: input
#    id: version
#    attributes:
#      label: Watchdog version
#      placeholder: 0.9.1
#    validations:
#      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: Installation method
      options:
        - Docker
        - Binary
        - Nix
        - Unraid
        - Coolify
        - Other (please describe above)
    validations:
      required: true
  
  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: Please provide any relevant service configuration
      render: yaml

  - type: textarea
    id: server-logs
    attributes:
      label: Server Logs
      description: Relevant errors from the watchdog-server logs (stdout / journal).
      render: shell

  - type: textarea
    id: agent-logs
    attributes:
      label: Agent Logs
      description: Please provide any logs from the agent, if relevant. Use `LOG_LEVEL=debug` for more info.
      render: shell
