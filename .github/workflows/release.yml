name: Make release and binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    env:
      WEB_ARCHIVE: watchdog-web_${{ github.ref_name }}.tar.gz
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix ./frontend

      - name: Build site
        run: npm run --prefix ./frontend build

      - name: Verify site
        run: |
          npm run --prefix ./frontend check
          npm run --prefix ./frontend test
          npm run --prefix ./frontend typecheck

      - name: Package site
        run: tar -C frontend/dist -czf "$WEB_ARCHIVE" .

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test Go services
        run: go test ./...

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Build .NET LHM executable for Windows sensors
        run: |
          dotnet build -c Release ./agent/lhm/watchdog_lhm.csproj
        shell: bash

      - name: GoReleaser watchdog
        uses: goreleaser/goreleaser-action@v6
        with:
          workdir: ./
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN || secrets.GITHUB_TOKEN }}
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          IS_FORK: ${{ github.repository_owner != 'cloudcache' }}

      - name: Upload site archive
        run: gh release upload "$GITHUB_REF_NAME" "$WEB_ARCHIVE" --clobber
        env:
          GH_TOKEN: ${{ secrets.TOKEN || secrets.GITHUB_TOKEN }}
