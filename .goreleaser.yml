version: 2

project_name: watchdog

before:
  hooks:
    - go mod tidy

builds:
  - id: watchdog-server
    binary: watchdog-server
    main: cmd/watchdog-server/main.go
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
      - freebsd
    goarch:
      - amd64
      - arm64
      - arm
    ignore:
      - goos: windows
        goarch: arm64
      - goos: windows
        goarch: arm
      - goos: freebsd
        goarch: arm64
      - goos: freebsd
        goarch: arm

  - id: watchdog-agent
    binary: watchdog-agent
    main: internal/cmd/agent/agent.go
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - freebsd
      - openbsd
      - windows
    goarch:
      - amd64
      - arm64
      - arm
      - mips64
      - riscv64
      - mipsle
      - mips
      - ppc64le
    gomips:
      - hardfloat
      - softfloat
    ignore:
      - goos: freebsd
        goarch: arm
      - goos: openbsd
        goarch: arm
      - goos: linux
        goarch: mips64
        gomips: softfloat
      - goos: linux
        goarch: mipsle
        gomips: hardfloat
      - goos: linux
        goarch: mips
        gomips: hardfloat
      - goos: windows
        goarch: arm
      - goos: darwin
        goarch: riscv64
      - goos: windows
        goarch: riscv64

  - id: watchdog-agent-linux-amd64-glibc
    binary: watchdog-agent
    main: internal/cmd/agent/agent.go
    env:
      - CGO_ENABLED=0
    flags:
      - -tags=glibc
    goos:
      - linux
    goarch:
      - amd64

archives:
  - id: watchdog-agent
    formats: [tar.gz]
    ids:
      - watchdog-agent
    name_template: >-
      {{ .Binary }}_
      {{- .Os }}_
      {{- .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]

  - id: watchdog-agent-linux-amd64-glibc
    formats: [tar.gz]
    ids:
      - watchdog-agent-linux-amd64-glibc
    name_template: >-
      {{ .Binary }}_
      {{- .Os }}_
      {{- .Arch }}_glibc

  - id: watchdog-server
    formats: [tar.gz]
    ids:
      - watchdog-server
    name_template: >-
      {{ .Binary }}_
      {{- .Os }}_
      {{- .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]

nfpms:
  - id: watchdog-agent
    package_name: watchdog-agent
    description: |-
      Agent for Watchdog
      Watchdog is a self-hosted monitoring and traffic-analysis platform for
      systems, network devices, and flow data. It provides a web interface,
      local user and role management, SNMP monitoring, and high-throughput
      sFlow/NetFlow/IPFIX flow analysis. The agent runs on each monitored
      host and reports system and container metrics to the server.
    maintainer: cloudcache <noreply@github.com>
    section: net
    ids:
      - watchdog-agent
    formats:
      - deb
    contents:
      - src: ./supplemental/debian/watchdog-agent.service
        dst: lib/systemd/system/watchdog-agent.service
        packager: deb
      - src: ./supplemental/debian/copyright
        dst: usr/share/doc/watchdog-agent/copyright
        packager: deb
      - src: ./supplemental/debian/lintian-overrides
        dst: usr/share/lintian/overrides/watchdog-agent
        packager: deb
    scripts:
      postinstall: ./supplemental/debian/postinstall.sh
      preremove: ./supplemental/debian/prerm.sh
      postremove: ./supplemental/debian/postrm.sh
    deb:
      predepends:
        - adduser
        - debconf
      scripts:
        templates: ./supplemental/debian/templates
        config: ./supplemental/debian/config.sh

scoops:
  - ids: [watchdog-agent]
    name: watchdog-agent
    repository:
      owner: cloudcache
      name: watchdog-scoops
    homepage: "https://github.com/cloudcache/watchdog"
    description: "Agent for Watchdog, a self-hosted monitoring and traffic-analysis platform."
    license: MIT
    skip_upload: '{{ if eq (tolower .Env.IS_FORK) "true" }}true{{ else }}auto{{ end }}'

brews:
  - ids: [watchdog-agent]
    name: watchdog-agent
    repository:
      owner: cloudcache
      name: homebrew-watchdog
    homepage: "https://github.com/cloudcache/watchdog"
    description: "Agent for Watchdog, a self-hosted monitoring and traffic-analysis platform."
    license: MIT
    skip_upload: '{{ if eq (tolower .Env.IS_FORK) "true" }}true{{ else }}auto{{ end }}'
    extra_install: |
      (bin/"watchdog-agent-launcher").write <<~EOS
        #!/bin/bash
        set -a
        if [ -f "$HOME/.config/watchdog/watchdog-agent.env" ]; then
          source "$HOME/.config/watchdog/watchdog-agent.env"
        fi
        set +a
        exec #{bin}/watchdog-agent "$@"
      EOS
      (bin/"watchdog-agent-launcher").chmod 0755
    service: |
      run ["#{bin}/watchdog-agent-launcher"]
      log_path "#{Dir.home}/.cache/watchdog/watchdog-agent.log"
      error_log_path "#{Dir.home}/.cache/watchdog/watchdog-agent.log"
      keep_alive true
      restart_delay 5
      process_type :background

winget:
  - ids: [watchdog-agent]
    name: watchdog-agent
    package_identifier: cloudcache.watchdog-agent
    publisher: cloudcache
    license: MIT
    license_url: "https://github.com/cloudcache/watchdog/blob/main/LICENSE"
    copyright: "2026 cloudcache"
    homepage: "https://github.com/cloudcache/watchdog"
    release_notes_url: "https://github.com/cloudcache/watchdog/releases/tag/v{{ .Version }}"
    publisher_support_url: "https://github.com/cloudcache/watchdog/issues"
    short_description: "Agent for Watchdog, a self-hosted monitoring and traffic-analysis platform."
    skip_upload: '{{ if eq (tolower .Env.IS_FORK) "true" }}true{{ else }}auto{{ end }}'
    description: |
      Watchdog is a self-hosted monitoring and traffic-analysis platform for
      systems, network devices, and flow data. It provides a web interface,
      local user and role management, SNMP monitoring, and high-throughput
      sFlow/NetFlow/IPFIX flow analysis. The agent runs on each monitored host
      and reports system and container metrics to the server.
    tags:
      - homelab
      - monitoring
      - self-hosted
    repository:
      owner: cloudcache
      name: watchdog-winget
      branch: cloudcache.watchdog-agent-{{ .Version }}
      token: "{{ .Env.WINGET_TOKEN }}"
      # pull_request:
      #   enabled: true
      #   draft: false
      #   base:
      #     owner: microsoft
      #     name: winget-pkgs
      #     branch: master

release:
  draft: true

changelog:
  disable: true
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
