# Watchdog Flow collector UDP receive buffers.
#
# The collector requests a large SO_RCVBUF (-receive-buffer), but the kernel
# silently clamps that request to net.core.rmem_max. When the granted buffer is
# small, a traffic burst or a brief Kafka Produce stall overflows the socket
# queue and drops sFlow/NetFlow datagrams — a loss the collector can only report
# after the fact. Raise the ceiling to the peak burst you must absorb.
#
# Install: copy to /etc/sysctl.d/90-watchdog-flow.conf and run `sysctl --system`.
# The collector logs "socket receive buffer clamped" when the effective buffer
# is below the requested size, which means this ceiling is still too low.
net.core.rmem_max = 67108864
net.core.rmem_default = 33554432
