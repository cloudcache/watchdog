# Watchdog web frontend and API behind one origin.
#
# Copy to /etc/nginx/conf.d/watchdog.conf, point `root` at the build output
# (`npm --prefix frontend run build` → frontend/dist), set the watchdog_api
# upstream to the local API process, and reload nginx. The public listen port is
# deployment-owned. Browsers use same-origin /api/ by default, so
# watchdog-config.js keeps API_URL empty.

upstream watchdog_api {
	server 127.0.0.1:8091;
}

server {
	listen 8090;
	server_name _;

	root /var/www/watchdog;
	index index.html;

	gzip on;
	gzip_types application/javascript text/css application/json image/svg+xml;
	gzip_min_length 1024;

	# API and resumable uploads (tus). The body limit is left to the API.
	location ^~ /api/ {
		proxy_pass http://watchdog_api;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_request_buffering off;
		proxy_read_timeout 300s;
		client_max_body_size 0;
	}

	# Hashed bundles never change under the same name; cache them for a year.
	location /assets/ {
		add_header Cache-Control "public, max-age=31536000, immutable" always;
		try_files $uri =404;
	}

	# HTML documents and runtime configuration are release entry points and must
	# never be reused across deployments.
	location = /index.html {
		add_header Cache-Control "no-store" always;
	}
	location ~ /index\.html$ {
		add_header Cache-Control "no-store" always;
		try_files $uri =404;
	}
	location = /watchdog-config.js {
		add_header Cache-Control "no-store" always;
		try_files /watchdog-config.js =404;
	}
	location ^~ /static/ {
		try_files $uri =404;
	}

	# The build emits one real document per fixed route and an explicit regex for
	# each dynamic detail route. There is no catch-all application fallback.
	include /var/www/watchdog/watchdog-mpa-routes.conf;

	# Static files shipped with the build are served as-is. Unknown documents are
	# real 404s instead of receiving an unrelated HTML application shell.
	location / {
		try_files $uri =404;
	}
}
