# Watchdog web frontend and API behind one origin.
#
# Copy to /etc/nginx/conf.d/watchdog.conf, point `root` at the build output
# (`npm --prefix frontend run build` → frontend/dist) and reload nginx. The API
# process (watchdog-server) keeps listening on 127.0.0.1:8091 only; browsers
# reach it through /api/ on this server, so `server.origins` (CORS) stays empty
# and frontend/public/watchdog-config.js keeps its default API_URL "".
#
# For TLS, terminate it in this server block; the API sees plain HTTP.

server {
	listen 8090;
	server_name _;

	root /var/www/watchdog;
	index index.html;

	gzip on;
	gzip_types application/javascript text/css application/json image/svg+xml;
	gzip_min_length 1024;

	# API and resumable uploads (tus). The body limit is left to the API.
	location /api/ {
		proxy_pass http://127.0.0.1:8091;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_read_timeout 300s;
		proxy_request_buffering off;
		client_max_body_size 0;
	}

	# Hashed bundles never change under the same name; cache them for a year.
	location /assets/ {
		add_header Cache-Control "public, max-age=31536000, immutable";
		try_files $uri =404;
	}

	# The entry document and the runtime config must always be revalidated,
	# otherwise a deploy leaves open tabs requesting chunks that no longer exist.
	location = /index.html {
		add_header Cache-Control "no-cache";
	}
	location = /watchdog-config.js {
		add_header Cache-Control "no-cache";
	}

	# Static files shipped with the build (/static/*, favicon) are served as-is;
	# every other path is a client-side route and resolves to the SPA entry.
	location / {
		try_files $uri $uri/ /index.html;
	}
}
